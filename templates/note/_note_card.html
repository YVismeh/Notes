<article class="note-card note-card--{{ note.color }}"
         data-id="{{ note.id }}"
         data-title="{{ note.title }}"
         data-content="{{ note.content }}"
         data-color="{{ note.color }}"
         data-pinned="{{ note.is_pinned|yesno:'1,0' }}"
         data-created="{{ note.created_at|date:'c' }}"
         data-updated="{{ note.updated_at|date:'c' }}"
         style="--i:{{ forloop.counter0|default:0 }}">
    <div class="note-card__head">
        <button type="button"
                class="icon-btn icon-btn--pin {% if note.is_pinned %}is-active{% endif %}"
                data-action="pin"
                aria-pressed="{{ note.is_pinned|yesno:'true,false' }}"
                aria-label="{% if note.is_pinned %}برداشتن سنجاق{% else %}سنجاق‌کردن{% endif %}"
                title="{% if note.is_pinned %}برداشتن سنجاق{% else %}سنجاق‌کردن{% endif %}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M9 4h6l1 6 2.5 2.5H5.5L8 10z"/>
                <path d="M12 12.5V20"/>
                <path d="M9.5 20h5"/>
            </svg>
        </button>

        <div class="note-card__actions">
            <button type="button" class="icon-btn" data-action="edit" aria-label="ویرایش" title="ویرایش">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M4 20h4l10.5-10.5a2.1 2.1 0 0 0-3-3L5 17z"/>
                    <path d="M13.5 6.5l3 3"/>
                </svg>
            </button>
            <button type="button" class="icon-btn icon-btn--danger" data-action="delete" aria-label="حذف" title="حذف">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
                     stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                    <path d="M4 7h16"/>
                    <path d="M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
                    <path d="M6.5 7l1 12a1 1 0 0 0 1 .9h7a1 1 0 0 0 1-.9l1-12"/>
                    <path d="M10 11v6M14 11v6"/>
                </svg>
            </button>
        </div>
    </div>

    <h3 class="note-card__title">{{ note.title }}</h3>

    {% if note.content %}
        <p class="note-card__content">{{ note.content }}</p>
    {% else %}
        <p class="note-card__content note-card__content--empty">بدون متن</p>
    {% endif %}

    <footer class="note-card__footer">
        <time class="note-card__time"
              datetime="{{ note.updated_at|date:'c' }}"
              data-datetime="{{ note.updated_at|date:'c' }}"
              title="{{ note.updated_at|date:'Y/m/d H:i' }}">{{ note.updated_at|date:'Y/m/d H:i' }}</time>
    </footer>
</article>
